let FACE=null;
IMG.onload=()=>{const c=document.createElement('canvas');c.width=60;c.height=80;const g=c.getContext('2d');
  g.beginPath();g.ellipse(30,42,28,37,0,0,Math.PI*2);g.clip();g.drawImage(IMG,482,512,92,124,0,0,60,80);FACE=c;};
function fit(){const s=Math.min(innerWidth/CW,innerHeight/CH);cv.style.width=(CW*s)+'px';cv.style.height=(CH*s)+'px';}
addEventListener('resize',fit);fit();
if('ontouchstart' in window||navigator.maxTouchPoints>0)document.body.classList.add('touch');

// ============ INPUT ============
const down=new Set(),pressed=new Set();
function kd(k){if(!down.has(k))pressed.add(k);down.add(k);initAudio();}
function ku(k){down.delete(k);}
const nk=e=>e.key.length===1?e.key.toLowerCase():e.key;
addEventListener('keydown',e=>{const k=nk(e);if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(k))e.preventDefault();kd(k);});
addEventListener('keyup',e=>ku(nk(e)));
addEventListener('blur',()=>down.clear());
document.querySelectorAll('.tb').forEach(b=>{const k=b.dataset.k;
  const on=e=>{e.preventDefault();kd(k);b.classList.add('on');},off=e=>{e.preventDefault();ku(k);b.classList.remove('on');};
  b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('pointerleave',off);});
cv.addEventListener('pointerdown',()=>{kd('Enter');setTimeout(()=>ku('Enter'),60);});
const isDown=(...k)=>k.some(x=>down.has(x)),isPressed=(...k)=>k.some(x=>pressed.has(x));
const btnA=()=>isPressed(' ','j','k','z','Enter','e');

// ============ AUDIO ============
let actx=null,master=null,musicOn=true;
function initAudio(){if(actx)return;try{actx=new (window.AudioContext||window.webkitAudioContext)();master=actx.createGain();master.gain.value=0.6;master.connect(actx.destination);}catch(e){}}
const mf=m=>440*Math.pow(2,(m-69)/12);
function tone(f1,f2,dur,type='square',vol=0.1,delay=0){if(!actx)return;const t=actx.currentTime+delay;
  const o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.setValueAtTime(f1,t);
  if(f2!==f1)o.frequency.exponentialRampToValueAtTime(f2,t+dur);g.gain.setValueAtTime(vol,t);
  g.gain.exponentialRampToValueAtTime(0.0008,t+dur);o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+0.05);}
const nt=(m,d,type,vol,delay)=>tone(mf(m),mf(m),d,type,vol,delay);
function sfx(n){switch(n){
  case'swing':tone(900,220,0.09,'sawtooth',0.035);break;

const SOLID='#HrwbD';
function solidAt(px,py,oob){const tx=Math.floor(px/T),ty=Math.floor(py/T);
  if(tx<0||ty<0||tx>=W||ty>=H)return oob;const c=ROOM.tiles[ty][tx];
  if(c==='G')return !G.gateOpen;return SOLID.includes(c);}
function collide(e,x,y,isEn){const hw=e.w/2,hh=e.h/2;
  const pts=[[x-hw,y-hh],[x+hw-.01,y-hh],[x-hw,y+hh-.01],[x+hw-.01,y+hh-.01],[x,y-hh],[x,y+hh-.01],[x-hw,y],[x+hw-.01,y]];
  for(const[px,py]of pts)if(solidAt(px,py,isEn))return true;
  if(!isEn)for(const n of npcs)if(Math.abs(n.x-x)<hw+11&&Math.abs(n.y-y)<hh+11)return true;
  return false;}
function move(e,dx,dy,isEn){let ok=true;
  if(dx){const nx=e.x+dx;if(!collide(e,nx,e.y,isEn))e.x=nx;else{ok=false;
    if(!isEn&&!dy){if(!collide(e,nx,e.y-9,isEn))e.y-=1.5;else if(!collide(e,nx,e.y+9,isEn))e.y+=1.5;}}}
  if(dy){const ny=e.y+dy;if(!collide(e,e.x,ny,isEn))e.y=ny;else{ok=false;
    if(!isEn&&!dx){if(!collide(e,e.x-9,ny,isEn))e.x-=1.5;else if(!collide(e,e.x+9,ny,isEn))e.x+=1.5;}}}
  return ok;}
const overlap=(a,b)=>Math.abs(a.x-b.x)<(a.w+b.w)/2&&Math.abs(a.y-b.y)<(a.h+b.h)/2;
const rectHit=(r,e)=>e.x+e.w/2>r.x&&e.x-e.w/2<r.x+r.w&&e.y+e.h/2>r.y&&e.y-e.h/2<r.y+r.h;

  for(const w of words){const t=cur?cur+' '+w:w;if(ctx.measureText(t).width>maxW&&cur){lines.push(cur);cur=w;}else cur=t;}
  if(cur)lines.push(cur);return lines;}
function say(list,onEnd){const pages=[];

  case'right':return{x:P.x+4,y:P.y-18,w:r,h:30};case'left':return{x:P.x-4-r,y:P.y-18,w:r,h:30};

  for(const e of enemies){if(e.hitBy===P.swing||e.inv>0||e.dead)continue;if(!rectHit(b,e))continue;
    e.hitBy=P.swing;e.hp--;const dx=e.x-P.x,dy=e.y-P.y,l=Math.hypot(dx,dy)||1,kb=e.t==='boss'?90:230;

  enemies=enemies.filter(e=>!e.dead);
  for(const s of shots)if(s.x>b.x&&s.x<b.x+b.w&&s.y>b.y&&s.y<b.y+b.h){s.dead=true;sfx('tink');burst(s.x,s.y,'#ffe08a',5,60);}
  shots=shots.filter(s=>!s.dead);
  const x0=Math.floor(b.x/T),x1=Math.floor((b.x+b.w)/T),y0=Math.floor(b.y/T),y1=Math.floor((b.y+b.h)/T);
  for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++){if(tx<0||ty<0||tx>=W||ty>=H)continue;
    if(ROOM.tiles[ty][tx]==='b'){ROOM.tiles[ty][tx]='.';sfx('cut');burst(tx*T+16,ty*T+16,'#4caf50',12,80);drop(tx*T+16,ty*T+16,0.8);}}}

function update(dt){
  tt+=dt;
  if(isPressed('m')){musicOn=!musicOn;}
  if(S==='title'){if(btnA()){initAudio();newGame();}return;}
  if(S==='end'){stateT+=dt;if(stateT>1.5&&btnA()){S='title';playTrack(null);}return;}
  if(S==='dead'){stateT+=dt;if(stateT>1.2&&btnA()){G.deaths++;P.hp=P.max;P.inv=1.5;P.kx=P.ky=0;P.atk=0;G.rx=0;G.ry=1;P.x=7*T;P.y=7.5*T;loadRoom();S='play';}return;}
  // shared anims
  for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=0.92;p.vy*=0.92;p.life-=dt;}parts=parts.filter(p=>p.life>0);
  for(const t of texts){t.y-=20*dt;t.life-=dt;}texts=texts.filter(t=>t.life>0);
  const fx=P.x+(P.face==='left'?16:-16),fy=P.y-40+Math.sin(tt*3)*5;F.x+=(fx-F.x)*Math.min(1,dt*4);F.y+=(fy-F.y)*Math.min(1,dt*4);
  fade=Math.max(0,fade-dt);
  if(dlg){updDialog(dt);return;}
  if(S==='ocarina'){stateT+=dt;if(Math.random()<dt*3)texts.push({x:P.x+(Math.random()-.5)*30,y:P.y-50,note:true,life:2});
    if(stateT>6.5){S='end';stateT=0;P.hold=null;playTrack('over');}return;}
  G.time+=dt;
  for(const t of timers)t.t-=dt;const due=timers.filter(t=>t.t<=0);timers=timers.filter(t=>t.t>0);due.forEach(t=>t.fn());
  if(dlg)return;
  roomTitle-=dt;gateCd-=dt;leaveCd-=dt;shake=Math.max(0,shake-dt);
  // player
  let mx=0,my=0;
  if(isDown('ArrowLeft','a'))mx--;if(isDown('ArrowRight','d'))mx++;if(isDown('ArrowUp','w'))my--;if(isDown('ArrowDown','s'))my++;
  if(P.atk>0){P.atk-=dt;mx=my=0;if(P.atk>0)swordHits();}
  if(mx||my){
    if(mx&&!my)P.face=mx<0?'left':'right';else if(my&&!mx)P.face=my<0?'up':'down';
    else if(!((P.face==='left'&&mx<0)||(P.face==='right'&&mx>0)||(P.face==='up'&&my<0)||(P.face==='down'&&my>0)))P.face=mx<0?'left':'right';
    const l=Math.hypot(mx,my);move(P,mx/l*110*dt,my/l*110*dt,false);P.walk+=dt;}
  if(P.kx||P.ky){move(P,P.kx*dt,P.ky*dt,false);const d=Math.exp(-10*dt);P.kx*=d;P.ky*=d;if(Math.abs(P.kx)+Math.abs(P.ky)<8)P.kx=P.ky=0;}
  P.inv-=dt;
  if(btnA()){const n=npcs.find(n=>Math.hypot(n.x-P.x,n.y-P.y)<42);
    if(n){talk(n);return;}
    if(G.hasSword&&P.atk<=0){P.atk=0.25;P.swing++;sfx('swing');swordHits();}}
  // enemies
  for(const e of enemies)updEnemy(e,dt);
  for(const e of enemies)if(overlap(P,e))hurt(e.t==='boss'?2:1,e.x,e.y);
  // shots
  for(const s of shots){s.x+=s.vx*dt;s.y+=s.vy*dt;
    if(s.x<-10||s.x>CW+10||s.y<-10||s.y>PH+10||(function(){const tx=Math.floor(s.x/T),ty=Math.floor(s.y/T);return tx>=0&&ty>=0&&tx<W&&ty<H&&'#HrD'.includes(ROOM.tiles[ty][tx]);})()){s.dead=true;burst(s.x,s.y,'#ccc',4,40);continue;}
    if(Math.hypot(s.x-P.x,s.y-(P.y-6))<s.r+10){s.dead=true;hurt(s.k==='grasso'?2:1,s.x,s.y);}}
  shots=shots.filter(s=>!s.dead);
  // pickups
  for(const p of pickups){p.life-=dt;if(Math.hypot(p.x-P.x,p.y-P.y)<18){p.dead=true;
    if(p.t==='euro'){G.euro++;sfx('euro');}else{P.hp=Math.min(P.max,P.hp+2);sfx('heart');}}}
  pickups=pickups.filter(p=>!p.dead&&p.life>0);
  // room clear / chest
  const d=ROOM.def;
  if(!ROOM.cleared&&d.enemies&&enemies.length===0){ROOM.cleared=true;sfx('secret');const c=chestPos();if(c)burst(c.x,c.y,'#fff',20,100);}
  const c=chestPos();
  if(c&&ROOM.cleared&&!ROOM.chestOpen&&Math.hypot(c.x-P.x,c.y-P.y)<26){openChest();return;}
  // gate
  if(ROOM.key==='1,1'&&!G.gateOpen&&P.y<T*1.9&&P.x>7*T-6&&P.x<9*T+6){
    if(ingCount()>=3){G.gateOpen=true;sfx('gate');shake=0.4;burst(8*T,16,'#ffb347',30,120);
      say([{who:'fata',text:'Il sigillo di olio bollente si e\' spezzato! Il covo del Re Gnocco Fritto ti aspetta...'}]);}
    else if(gateCd<=0){gateCd=5;say([{who:'fata',text:'Ehi! Ascolta! Un sigillo di olio bollente blocca il passaggio. Servono i 3 ingredienti sacri!'}]);}}
  // transitions
  let dx=0,dy=0;if(P.x<0)dx=-1;else if(P.x>CW)dx=1;else if(P.y<0)dy=-1;else if(P.y>PH)dy=1;
  if(dx||dy){
    if(!G.hasSword){P.x=Math.max(10,Math.min(CW-10,P.x));P.y=Math.max(10,Math.min(PH-10,P.y));
      if(leaveCd<=0){leaveCd=3;say([{who:'fata',text:'Ehi! Ascolta! Non puoi uscire disarmato! Parla prima con la Nonna.'}]);}}
    else{G.rx+=dx;G.ry+=dy;if(dx===-1)P.x=CW-10;if(dx===1)P.x=10;if(dy===-1)P.y=PH-10;if(dy===1)P.y=10;
      P.kx=P.ky=0;loadRoom();F.x=P.x;F.y=P.y-40;}}
}
function randDir4(){return[[1,0],[-1,0],[0,1],[0,-1]][Math.random()*4|0];}
function updEnemy(e,dt){
  e.inv-=dt;e.anim+=dt;
  if(e.kx||e.ky){move(e,e.kx*dt,e.ky*dt,true);const d=Math.exp(-12*dt);e.kx*=d;e.ky*=d;if(Math.abs(e.kx)+Math.abs(e.ky)<5)e.kx=e.ky=0;}
  const dx=P.x-e.x,dy=P.y-e.y,dist=Math.hypot(dx,dy)||1;
  if(e.t==='sugo'){e.timer-=dt;if(e.timer<=0){e.timer=0.5+Math.random()*0.8;
      if(Math.random()<0.6)e.dir=[dx/dist,dy/dist];else{const a=Math.random()*6.28;e.dir=[Math.cos(a),Math.sin(a)];}}
    move(e,e.dir[0]*45*dt,e.dir[1]*45*dt,true);}
  else if(e.t==='pomo'){e.timer-=dt;
    if(e.st==='aim'){if(e.timer<=0){shoot(e.x,e.y-10,e.dir[0]*150,e.dir[1]*150,'seme');sfx('pew');e.st='walk';e.timer=1.4+Math.random()*1.5;}}

      if(e.timer<=0){e.dir=Math.abs(dx)>Math.abs(dy)?[Math.sign(dx),0]:[0,Math.sign(dy)];e.st='aim';e.timer=0.45;}}}

    if(e.timer<=0){e.timer=2+Math.random()*1.2;if(dist<330){shoot(e.x+e.dir[0]*10,e.y-12+e.dir[1]*10,e.dir[0]*125,e.dir[1]*125,'nocciolo');sfx('pew');}}}

    if(p2&&!e.p2){e.p2=true;texts.push({x:e.x,y:e.y-60,s:'GRRRR!',life:1.6});sfx('roar');shake=0.4;

        sfx('splat');e.st='move';e.t2=1.6+Math.random()*1.2;}}
    else if(e.st==='aimDash'){if(e.t2<=0){e.st='dash';e.t2=0.75;e.dvx=dx/dist*230*sp;e.dvy=dy/dist*230*sp;sfx('dash');}}
    else if(e.st==='dash'){const a=move(e,e.dvx*dt,0,true),b=move(e,0,e.dvy*dt,true);
      if(!a||!b||e.t2<=0){if(!a||!b){shake=0.25;sfx('thud');}e.st='move';e.t2=1.4+Math.random();

}

    else if(style==='beach'){fr(x,y,T,T,'#e8d39a');if((tx*5+ty*3)%4===0)fr(x+8,y+10,2,2,'#cdb67a');if((tx+ty*7)%5===1)fr(x+20,y+22,2,2,'#cdb67a');}
    else{fr(x,y,T,T,'#4f9e3f');const s=(tx*7+ty*13)%5;fr(x+4+s*3,y+6,2,4,'#418a33');fr(x+22-s,y+20,2,4,'#418a33');fr(x+13,y+14+s,2,3,'#5cb04a');}};
  const path=()=>{fr(x,y,T,T,'#c9a86a');fr(x+6+(tx*3%7),y+8,3,2,'#b8955a');fr(x+18,y+22-(ty%4),3,2,'#b8955a');};
  switch(c){
  case'.':case'_':floor();break;
  case',':path();break;
  case'f':floor();[[10,12,'#ffe36e'],[22,20,'#ff8fb0'],[12,25,'#fff']].forEach(([a,b,col])=>{ci(x+a,y+b,3,col);ci(x+a,y+b,1.2,'#f5a623');});break;
  case'#':if(style==='dungeon'){fr(x,y,T,T,'#3a3029');for(let r=0;r<4;r++){const o=r%2?8:0;for(let k=-1;k<2;k++)fr(x+o+k*16+1,y+r*8+1,14,6,'#56473b');}}
    else if(style==='beach'){floor();fr(x+14,y+12,4,20,'#8a6a3a');[[-1,-0.3],[1,-0.3],[-0.6,0.5],[0.6,0.5]].forEach(([a,b])=>el(x+16+a*9,y+10+b*6,10,4,'#2f8f3a'));ci(x+16,y+11,3,'#6b4a20');}
    else{fr(x,y,T,T,'#2b5e27');ci(x+16,y+15,15,'#2f6b2a');ci(x+10,y+10,8,'#3f8436');ci(x+23,y+18,7,'#367a30');ci(x+9,y+9,3,'#4f9a44');}break;
  case'H':{floor();const above=ty>0&&ROOM.tiles[ty-1][tx]==='H',left=tx>0&&ROOM.tiles[ty][tx-1]==='H';
    if(!above){fr(x,y+4,T,T-4,'#b4452f');for(let i=0;i<4;i++)fr(x,y+8+i*6,T,1,'#8a3020');fr(x,y+4,T,2,'#d0644a');}
    else{fr(x,y,T,T,'#ead7b2');fr(x,y,T,3,'#8a3020');if(!left){fr(x+18,y+10,12,22,'#6b4320');ci(x+27,y+21,1.5,'#d4af37');}
      else{fr(x+4,y+9,12,10,'#7fc8ff');fr(x+9,y+9,2,10,'#6b4320');fr(x+4,y+13,12,2,'#6b4320');}}break;}
  case'r':floor();el(x+16,y+21,13,9,'#6f747b');el(x+15,y+18,12,9,'#8a8f96');el(x+12,y+15,6,4,'#a9aeb5');break;
  case'w':{fr(x,y,T,T,'#2f6fc4');const o=Math.sin(tt*2+tx+ty*0.7)*4;fr(x+6+o,y+8,9,2,'#6aa6ee');fr(x+16-o,y+20,9,2,'#6aa6ee');
    const up=ty>0&&ROOM.tiles[ty-1][tx]!=='w'&&ROOM.tiles[ty-1][tx]!=='#';if(up)fr(x,y,T,3,'#cfe6ff');break;}
  case'b':floor();ci(x+16,y+18,13,'#2e7d32');ci(x+12,y+13,6,'#4caf50');ci(x+21,y+19,5,'#43a047');ci(x+10,y+22,3,'#43a047');break;
  case'G':path();if(!G.gateOpen){const gl=0.25+Math.sin(tt*4)*0.15;fr(x,y,T,T,`rgba(255,140,30,${gl})`);
      for(let i=0;i<4;i++)fr(x+3+i*8,y,3,T,'#f2c14e');fr(x,y+6,T,3,'#f2c14e');fr(x,y+22,T,3,'#f2c14e');}break;
  case'D':floor();fr(x,y,T,T,'#2a221c');for(let i=0;i<4;i++)fr(x+3+i*8,y,3,T,'#777');fr(x,y+8,T,3,'#777');break;
  }}

// ============ DRAW ============
function drawTitle(){fr(0,0,CW,CH,'#000');
  if(IMG.complete&&IMG.naturalWidth)ctx.drawImage(IMG,0,80,1024,751,0,0,CW,CH);
  const g=ctx.createLinearGradient(0,CH-110,0,CH);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.85)');ctx.fillStyle=g;ctx.fillRect(0,CH-110,CW,110);
  txt('- DEMO -',CW/2,CH-62,'#f2c14e',10,'center');
  if(Math.floor(tt*2)%2===0)txt('PREMI INVIO / TOCCA',CW/2,CH-40,'#fff',10,'center');
  txt('Frecce/WASD: muovi   Spazio: attacca/parla   M: musica',CW/2,CH-14,'#bbb',6,'center');}
function drawHUD(){fr(0,0,CW,HUD,'#000');fr(0,HUD-2,CW,2,'#3a2a10');
  txt('-VITA-',10,11,'#e8303a',6);for(let i=0;i<P.max/2;i++){const v=P.hp-i*2;drawHeartShape(16+i*18,21,v>=2?1:v===1?0.5:0,6);}
  fr(84,6,22,22,'#1b1b1b');ctx.strokeStyle='#888';ctx.strokeRect(84.5,6.5,21,21);txt('A',86,14,'#7f7',6);if(G.hasSword)drawItem('mattarello',95,18,0.8);
  ci(124,17,6,'#f2c14e');ci(124,17,4,'#e0a92e');txt('E',121,20,'#8a5a00',6);txt('x'+String(G.euro).padStart(2,'0'),134,21,'#fff',8);

  const keys=['farina','squacquerone','crudo'];keys.forEach((k,i)=>{const x=CW-86+i*27;fr(x,5,23,23,'#1b1b1b');ctx.strokeStyle=G.ing[k]?'#f2c14e':'#444';ctx.strokeRect(x+.5,5.5,22,22);
    if(G.ing[k])drawItem(k,x+11.5,17,0.85);else txt('?',x+8,21,'#444',8);});}
function drawDialog(){const pg=dlg.pages[dlg.i],sp=pg.who?SPK[pg.who]:null,bx=6,by=CH-96,bw=CW-12,bh=90;
  rr(bx,by,bw,bh,8,'rgba(8,12,40,.93)');ctx.strokeStyle='#e8e0c0';ctx.lineWidth=2;ctx.beginPath();ctx.roundRect?ctx.roundRect(bx+3,by+3,bw-6,bh-6,6):ctx.rect(bx+3,by+3,bw-6,bh-6);ctx.stroke();ctx.lineWidth=1;
  let tx=bx+14,ty=by+24;
  if(sp){fr(bx+10,by+16,54,58,'#1d2550');ctx.save();ctx.beginPath();ctx.rect(bx+10,by+16,54,58);ctx.clip();
    const px=bx+37,py=by+16;
    if(pg.who==='eros'){if(FACE)ctx.drawImage(FACE,px-21,py+4,42,56);}
    else if(pg.who==='nonna')spr(drawNonna,px,py+68,1.6);
    else if(pg.who==='barista')spr(drawBarista,px,py+70,1.6);
    else if(pg.who==='sign')spr(drawSign,px,py+60,1.5);
    else if(pg.who==='gnocco')spr(()=>drawBoss({st:''}),px,py+66,0.85);
    else if(pg.who==='fata')drawFairy(px,py+29);
    ctx.restore();tx=bx+74;txt(sp.name,tx,by+18,sp.col,8);ty=by+36;}
  let left=Math.floor(dlg.chars);
  pg.lines.forEach((l,i)=>{const s=l.slice(0,Math.max(0,left));left-=l.length;txt(s,tx,ty+i*14,'#fff',8);});
  if(dlg.chars>=pg.lines.join('').length&&Math.floor(tt*3)%2===0)poly('#f2c14e',bx+bw-22,by+bh-16,bx+bw-12,by+bh-16,bx+bw-17,by+bh-10);}
function drawWorld(){
  const d=ROOM.def;
  for(let ty=0;ty<H;ty++)for(let tx=0;tx<W;tx++)drawTile(ROOM.tiles[ty][tx],tx,ty,d.style);
  const c=chestPos();if(c&&ROOM.cleared)drawChest(c.x,c.y,ROOM.chestOpen);
  for(const p of pickups){if(p.life<2&&Math.floor(tt*10)%2)continue;const b=Math.sin(tt*5+p.x)*2;
    if(p.t==='euro'){el(p.x,p.y+6,5,2,'rgba(0,0,0,.3)');ci(p.x,p.y+b,6,'#f2c14e');ci(p.x,p.y+b,4,'#e0a92e');txt('E',p.x-3,p.y+b+3,'#8a5a00',6);}
    else drawHeartShape(p.x,p.y+b,1,6);}
  const ents=[];
  npcs.forEach(n=>ents.push({y:n.y,f:()=>spr(n.t==='nonna'?drawNonna:n.t==='barista'?drawBarista:drawSign,n.x,n.y+10)}));
  enemies.forEach(e=>ents.push({y:e.y,f:()=>{if(e.inv>0&&Math.floor(tt*30)%2)ctx.globalAlpha=0.4;
    spr(()=>e.t==='sugo'?drawSugo(e):e.t==='pomo'?drawPomo(e):e.t==='deku'?drawDeku(e):drawBoss(e),e.x,e.y+e.h/2);ctx.globalAlpha=1;}}));
  ents.push({y:P.y,f:drawPlayer});
  ents.sort((a,b)=>a.y-b.y).forEach(e=>e.f());
  for(const s of shots){if(s.k==='grasso'){ci(s.x,s.y,s.r,'#f6d36b');ci(s.x-2,s.y-2,2,'#fffbe0');}
    else if(s.k==='seme'){el(s.x,s.y,4,3,'#f3e7a0');}else{ci(s.x,s.y,s.r,'#4a5a2a');ci(s.x-1,s.y-1,1.5,'#8fa060');}}
  for(const p of parts){ctx.globalAlpha=Math.min(1,p.life*2);fr(p.x,p.y,p.s,p.s,p.c);}ctx.globalAlpha=1;
  // boss hp
  const b=enemies.find(e=>e.t==='boss');
  if(b){fr(CW/2-101,PH-20,202,10,'#000');fr(CW/2-100,PH-19,200*b.hp/b.maxHp,8,'#e8803a');txt('RE GNOCCO FRITTO',CW/2,PH-24,'#ffcf8a',6,'center');}
  if(G.hasSword||S==='ocarina')drawFairy(F.x,F.y);else drawFairy(F.x,F.y);
  for(const t of texts){ctx.globalAlpha=Math.min(1,t.life);if(t.note){const x=t.x+Math.sin(t.life*5)*6;ci(x,t.y,3.5,'#fff');fr(x+2.5,t.y-12,1.5,12,'#fff');fr(x+2.5,t.y-12,5,2,'#fff');}
    else txt(t.s,t.x,t.y,'#ffcf8a',10,'center');}ctx.globalAlpha=1;
  if(roomTitle>0&&!dlg){ctx.globalAlpha=Math.min(1,roomTitle);const nm=d.name;ctx.font='8px '+FONT;const w=ctx.measureText(nm).width+24;
    rr(CW/2-w/2,8,w,22,6,'rgba(0,0,0,.7)');txt(nm,CW/2,23,'#f2c14e',8,'center');ctx.globalAlpha=1;}}
function drawPlayer(){
  if(P.inv>0&&S==='play'&&Math.floor(tt*20)%2)return;
  const behind=P.atk>0&&P.face==='up';
  if(behind)drawSwing();
  spr(()=>drawEros(P.face,P.walk,P.hold),P.x,P.y+8,1,P.face==='left');
  if(P.atk>0&&!behind)drawSwing();
  if(P.hold)drawItem(P.hold,P.x,P.y-50,1.3);}
function drawSwing(){const base={right:0,down:Math.PI/2,left:Math.PI,up:-Math.PI/2}[P.face];const p=1-P.atk/0.25;
  const dir=(P.face==='left'||P.face==='up')?-1:1;const a=base+dir*(-1.1+2.2*p);
  ctx.save();ctx.translate(P.x,P.y-6);ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=6;ctx.beginPath();
  ctx.arc(0,0,28,Math.min(base-dir*1.1,a),Math.max(base-dir*1.1,a));ctx.stroke();ctx.lineWidth=1;
  ctx.rotate(a);fr(8,-4,28,8,'#e8c48a');fr(8,-4,28,2,'#f6dcae');fr(2,-2,6,4,'#8a5a2a');fr(36,-2,6,4,'#8a5a2a');ctx.restore();}
function drawEnd(){fr(0,0,CW,CH,'#05060f');
  for(let i=0;i<40;i++){const x=(i*97)%CW,y=(i*53+tt*8)%CH;fr(x,y,1,1,'#ffffff88');}
  txt('THE LEGEND OF',CW/2,60,'#f2c14e',10,'center');txt('ZEROS',CW/2,92,'#f2c14e',24,'center');
  txt('La Piadina del Tempo',CW/2,114,'#e8e0c0',8,'center');
  drawItem('piadina',CW/2,148,2);
  txt('LA ROMAGNA E\' SALVA!',CW/2,190,'#7dff7d',10,'center');
  const tm=Math.floor(G.time),s=`Tempo ${Math.floor(tm/60)}:${String(tm%60).padStart(2,'0')}   Euro ${G.euro}   Svenimenti ${G.deaths}`;
  txt(s,CW/2,216,'#fff',7,'center');
  txt('Eros tornera\' in:',CW/2,252,'#aaa',7,'center');
  txt('"MAJORA\'S SQUACQUERONE"',CW/2,272,'#ff9a5a',9,'center');
  txt('FINE DELLA DEMO',CW/2,306,'#e8e0c0',8,'center');
  if(stateT>1.5&&Math.floor(tt*2)%2===0)txt('PREMI INVIO',CW/2,332,'#fff',8,'center');}
function draw(){
  ctx.imageSmoothingEnabled=true;
  if(S==='title'){drawTitle();return;}
  if(S==='end'){drawEnd();return;}
  fr(0,0,CW,CH,'#000');
  ctx.save();const sx=shake>0?(Math.random()-.5)*6:0,sy=shake>0?(Math.random()-.5)*6:0;ctx.translate(sx,HUD+sy);
  ctx.beginPath();ctx.rect(0,0,CW,PH);ctx.clip();drawWorld();
  if(fade>0){ctx.fillStyle=`rgba(0,0,0,${fade/0.35})`;ctx.fillRect(0,0,CW,PH);}
  if(S==='ocarina'){ctx.fillStyle='rgba(255,230,150,.12)';ctx.fillRect(0,0,CW,PH);txt('~ La Canzone della Piadina ~',CW/2,40,'#fff2b0',9,'center');}
  ctx.restore();
  drawHUD();
  if(S==='dead'){ctx.fillStyle=`rgba(90,0,0,${Math.min(0.75,stateT)})`;ctx.fillRect(0,0,CW,CH);
    txt('EROS E\' SVENUTO...',CW/2,CH/2-10,'#fff',12,'center');txt('...ma il profumo di una piadina lo rianima.',CW/2,CH/2+14,'#f2c14e',7,'center');
    if(stateT>1.2&&Math.floor(tt*2)%2===0)txt('PREMI A PER RIALZARTI',CW/2,CH/2+44,'#fff',8,'center');}
  if(dlg)drawDialog();
  if(!musicOn)txt('MUSICA OFF',CW-6,CH-6,'#888',6,'right');}

// ============ LOOP ============
let last=performance.now();
function frame(now){const dt=Math.min(0.05,(now-last)/1000);last=now;update(dt);draw();pressed.clear();musicTick();requestAnimationFrame(frame);}
(document.fonts&&document.fonts.load?document.fonts.load('8px "Press Start 2P"').catch(()=>{}):Promise.resolve()).finally(()=>requestAnimationFrame(frame));
</script>
</body>
